name: Build NOXXA REWIND v2.1.3

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'v2/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate v2.1.3 source
        shell: bash
        run: |
          set -euxo pipefail
          test -f v2/Android.mk
          test -f v2/Application.mk
          test -f v2/src/main.cpp
          test -f v2/src/WorldState.cpp
          test -f v2/src/RewindCore.cpp
          test -f v2/src/RewindAudio.cpp
          test -f v2/src/RewindUI.cpp
          test -f v2/scripts/bootstrap_deps.sh
          test -f v2/scripts/synth_audio.py
          grep -q '2.1.3' v2/src/main.cpp
          grep -q 'MaxRewindSeconds=13.000' v2/NoxxaRewind.ini.example
          grep -q 'ButtonX=0.075' v2/NoxxaRewind.ini.example
          grep -q 'DrawLeftTriangle' v2/src/RewindUI.cpp
          chmod +x v2/scripts/bootstrap_deps.sh v2/scripts/synth_audio.py

      - name: Generate CI fallback audio
        working-directory: v2
        run: python3 scripts/synth_audio.py

      - name: Fetch pinned AML dependencies
        working-directory: v2
        run: ./scripts/bootstrap_deps.sh

      - name: Set up Android NDK r24
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r24
          add-to-path: true

      - name: Build armeabi-v7a mod
        working-directory: v2
        shell: bash
        run: |
          set -euxo pipefail
          ndk-build clean \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=Android.mk \
            NDK_APPLICATION_MK=Application.mk || true

          ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=Android.mk \
            NDK_APPLICATION_MK=Application.mk \
            APP_CPPFLAGS='-std=c++17 -fexceptions -include math.h -include float.h' \
            V=1 \
            -j2

      - name: Run timeline unit test
        working-directory: v2
        shell: bash
        run: |
          set -euxo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra tests/timeline_test.cpp -o tests/timeline_test
          ./tests/timeline_test

      - name: Package installable v2.1.3 CI fallback
        working-directory: v2
        shell: bash
        run: |
          set -euxo pipefail
          test -s libs/armeabi-v7a/libNoxxaRewind.so
          rm -rf release
          mkdir -p release/NoxxaRewind
          cp libs/armeabi-v7a/libNoxxaRewind.so release/
          # Public CI artifact keeps generated fallback audio. The user's exact
          # uploaded SFX is injected only into the private chat-delivered ZIP.
          cp generated_audio/rewind_loop.wav release/NoxxaRewind/rewind_user.wav
          cp NoxxaRewind.ini.example release/
          cp INSTALL.md release/
          cp README.md release/README-v2.md
          printf '%s\n' 'NOXXA REWIND v2.1.3 - 13S + TOP-LEFT VECTOR UI' > release/VERSION.txt
          cd release
          zip -qr ../NOXXA_REWIND-v2.1.3.zip .

      - name: Upload v2.1.3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOXXA_REWIND-v2.1.3
          path: v2/NOXXA_REWIND-v2.1.3.zip
          if-no-files-found: error
          compression-level: 0
